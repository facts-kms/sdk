name: Facts SDK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest
    container: rust:1.86-bookworm
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version
          cargo --version
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run lint
        run: ./run deploy phase lint

  test:
    runs-on: ubuntu-latest
    container: rust:1.86-bookworm
    needs:
      - lint
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version
          cargo --version
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run test
        run: ./run deploy phase test

  build:
    runs-on: ubuntu-latest
    container: rust:1.86-bookworm
    needs:
      - test
    if: contains(github.ref_name, '-build-')
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version
          cargo --version
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run build
        run: ./run deploy phase build

  release:
    runs-on: ubuntu-latest
    container: rust:1.86-bookworm
    needs:
      - test
    if: contains(github.ref_name, '-release-')
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version
          cargo --version
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run release
        run: ./run deploy phase release

  deploy:
    runs-on: ubuntu-latest
    container: rust:1.86-bookworm
    needs:
      - test
    if: contains(github.ref_name, '-deploy-')
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version
          cargo --version
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run deploy
        run: ./run deploy phase deploy

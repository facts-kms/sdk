name: Facts SDK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run lint
        run: ./run deploy phase lint

  test:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    needs:
      - lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run test
        run: ./run deploy phase test

  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    needs:
      - test
    if: contains(github.ref_name, '-build-')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run build
        run: ./run deploy phase build

  release:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    needs:
      - test
    if: contains(github.ref_name, '-release-')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run release
        run: ./run deploy phase release

  deploy:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    needs:
      - test
    if: contains(github.ref_name, '-deploy-')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run deploy
        run: ./run deploy phase deploy
